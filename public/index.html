      :root {

        -webkit-text-size-adjust: 100%;

        background: var(--bg);

        font-size: 20px;
        line-height: 1.25;

        background-image: radial-gradient(#221a4d 2px, transparent 2px);

      }
      .logo {
        text-shadow: 3px 3px 0 var(--a2);

      .px {
        border: 4px solid var(--fg);
        box-shadow: 6px 6px 0 var(--sh);
        background: var(--panel);
      }
      .px > .h:first-child {
        color: var(--a1);

      .card {
        background: var(--card);
        color: var(--ink);
        border: 4px solid var(--ink);
        box-shadow: 5px 5px 0 var(--sh);
      }
      .btn {
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        line-height: 1.2;

        min-height: 36px;
        border: 3px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      @media (pointer: coarse) {
        .btn {
          min-height: 44px;
        }
      }
      .btn:hover {
        background: var(--a1);
        color: var(--ink);
        border-color: var(--a1);
      }
      .card .btn:hover {
        background: var(--ink);
        color: var(--card);
        border-color: var(--ink);
      }
      .btn.pri {
        background: var(--a1);
        color: var(--ink);
        border-color: var(--a1);
        box-shadow: 3px 3px 0 var(--a2);
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      input,
      select {
        background: var(--bg);
        color: var(--fg);
        border: 3px solid var(--fg);

        font-size: 20px;
        color-scheme: dark;
        outline: none;
      }
      input:focus,

        border-color: var(--a1);
        box-shadow: 4px 4px 0 var(--sh);

        background: var(--a1);
