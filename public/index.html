<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0b1f">
<title>StudyTask — Quest Board Mahasiswa</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  /* PALET WARNA: ubah variabel ini untuk ganti tema seluruh aplikasi */
  :root{--bg:#0f0b1f;--panel:#1a1438;--fg:#f5f0ff;--ink:#0f0b1f;--card:#fff3c4;--sh:#6c4dff;
    --a1:#ffd23f;--a2:#ff4f9a;--a3:#38f2b0;--a4:#4cc9f0;--hot:#ff8a3d}
  *{border-radius:0!important;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--fg);font-family:'VT323',monospace;font-size:20px;line-height:1.25;overflow-x:hidden;
    background-image:radial-gradient(#221a4d 2px,transparent 2px);background-size:12px 12px;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  @media(min-width:768px){body{font-size:22px}}
  .h{font-family:'Press Start 2P',monospace;line-height:1.5}
  .logo{text-shadow:3px 3px 0 var(--a2)}
  .px{border:4px solid var(--fg);box-shadow:6px 6px 0 var(--sh);background:var(--panel)}
  .px>.h:first-child{color:var(--a1)}
  .card{background:var(--card);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--sh)}
  .btn{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.2;padding:8px 10px;min-height:36px;
    border:3px solid currentColor;background:transparent;color:inherit;cursor:pointer}
  @media(pointer:coarse){.btn{min-height:44px}}
  .btn:hover{background:var(--a1);color:var(--ink);border-color:var(--a1)}
  .card .btn:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .btn.pri{background:var(--a1);color:var(--ink);border-color:var(--a1);box-shadow:3px 3px 0 var(--a2)}
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  input,select{background:var(--bg);color:var(--fg);border:3px solid var(--fg);padding:6px 10px;width:100%;min-width:0;
    font:inherit;font-size:20px;color-scheme:dark;outline:none}
  input:focus,select:focus{border-color:var(--a1);box-shadow:4px 4px 0 var(--sh)}
  .seg{flex:1;height:20px;border:3px solid #4b3f8a}
  .seg.on{background:var(--a1);border-color:var(--a1)}.seg.on.hot{background:var(--hot);border-color:var(--hot)}
  .tag{background:var(--ink);color:var(--card);padding:0 6px}
  .late{color:#e0246f}
  .toast{background:var(--a1);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--a2)}
  .demo{background:var(--a2);color:var(--ink)}
  .blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const COLS=[{k:"todo",n:"TO DO"},{k:"doing",n:"DOING"},{k:"done",n:"DONE"}];
const PRI=["","EASY","MID","BOSS"];
const CCOL={todo:"var(--a4)",doing:"var(--a1)",done:"var(--a3)"};
const PCOL=["","#0f9d74","#cf8f00","#e0246f"];
const BCOL={first:"var(--a1)",q10:"var(--a2)",boss:"var(--a3)",early:"var(--a4)",s3:"var(--hot)",s7:"var(--a1)"};
// Badge: ikon bitmap 5x5 ("#" = pixel nyala). Aturan perolehan ada di backend (api/index.py)
const BADGES=[
  {c:"first",n:"QUEST PERTAMA",d:"Selesaikan 1 tugas",m:"..#../.###./#####/.###./.#.#."},
  {c:"q10",n:"RAJIN",d:"Selesaikan 10 tugas",m:".#.#./#####/#####/.###./..#.."},
  {c:"boss",n:"BOSS SLAYER",d:"Kalahkan 1 tugas BOSS",m:".###./#####/#.#.#/#####/.#.#."},
  {c:"early",n:"ANTI KEBUT",d:"3 tugas selesai sebelum deadline",m:"...#./..##./.###./..##./.#..."},
  {c:"s3",n:"API KECIL",d:"Streak 3 hari",m:"..#../.##../.###./#####/.###."},
  {c:"s7",n:"RAJA STREAK",d:"Streak 7 hari",m:"#.#.#/#####/#####/#####/....."}];
const iso=n=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4+n*864e5).toISOString().slice(0,10);
const day=d=>d?Math.round((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/864e5):null;
const lbl=d=>{const n=day(d);return n===null?"tanpa deadline":n<0?`TELAT ${-n} hari`:n===0?"HARI INI!":`H-${n}`};

// ---- Mode demo: dipakai otomatis kalau backend /api tidak ada (mis. file dibuka langsung) ----
let demo={user:null,tasks:[
  {id:"d1",title:"Laporan Praktikum Basis Data",subject:"Basis Data",deadline:iso(1),priority:3,status:"doing",notes:"Bab ERD + normalisasi"},
  {id:"d2",title:"Rangkuman Jurnal Sistem Operasi",subject:"Sistem Operasi",deadline:iso(5),priority:2,status:"todo",notes:""},
  {id:"d3",title:"Quiz Kalkulus 2",subject:"Kalkulus",deadline:iso(-1),priority:1,status:"done",notes:""}]};
const demoMe=()=>{
  const dn=demo.tasks.filter(t=>t.status==="done").length;
  const days=[iso(-2),iso(-1),...(dn?[iso(0)]:[])];
  return {user:{username:demo.user},days,streak:days.length,best:days.length,new:[],
    earned:[...(dn?["first"]:[]),...(days.length>=3?["s3"]:[])]};
};
function fake(m,p,b){
  const ok=d=>({ok:true,status:200,data:d});
  if(p==="/register"||p==="/login"){demo.user=b.username||"demo";return ok({user:{username:demo.user}})}
  if(p==="/logout"){demo.user=null;return ok({})}
  if(!demo.user)return {ok:false,status:401,data:{error:"belum login"}};
  if(p.startsWith("/me"))return ok(demoMe());
  const id=p.split("/")[2];
  if(m==="GET")return ok([...demo.tasks]);
  if(m==="POST")demo.tasks.push({...b,id:"d"+Date.now(),status:"todo"});
  if(m==="PUT")demo.tasks=demo.tasks.map(t=>t.id===id?{...t,...b}:t);
  if(m==="DELETE")demo.tasks=demo.tasks.filter(t=>t.id!==id);
  return ok({});
}
async function api(method,path,body){
  try{
    const r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json"},body:body&&JSON.stringify(body)});
    const data=await r.json();window.__off=false;
    return {ok:r.ok,status:r.status,data};
  }catch{window.__off=true;return fake(method,path,body)}
}

const Pix=({m,z=40,col="var(--fg)"})=><div className="grid grid-cols-5 mx-auto" style={{width:z,height:z}}>
  {m.replace(/\//g,"").split("").map((c,i)=><div key={i} style={{background:c==="#"?col:"transparent"}}/>)}</div>;

function Pomo(){
  const [s,setS]=useState(1500),[on,setOn]=useState(false);
  useEffect(()=>{if(!on)return;const i=setInterval(()=>setS(x=>x-1),1000);return()=>clearInterval(i)},[on]);
  useEffect(()=>{if(s<=0){setOn(false);setS(1500)}},[s]);
  const p=n=>String(n).padStart(2,"0");
  return <div className="px p-4 text-center">
    <div className="h text-xs mb-2">FOCUS MODE</div>
    <div className="h text-3xl mb-3">{p(Math.floor(s/60))}:{p(s%60)}</div>
    <button className="btn mr-2" onClick={()=>setOn(!on)}>{on?"PAUSE":"START"}</button>
    <button className="btn" onClick={()=>{setOn(false);setS(1500)}}>RESET</button>
  </div>;
}

function Auth({done,off}){
  const [mode,setMode]=useState("login"),[u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState("");
  const go=async e=>{e.preventDefault();const r=await api("POST","/"+mode,{username:u,password:p});
    r.ok?done():setErr(r.data.error||"gagal, coba lagi")};
  return <main className="grid place-items-center p-4" style={{minHeight:"100dvh"}}>
    <form onSubmit={go} className="px p-6 w-full max-w-md grid gap-4">
      <h1 className="h logo text-xl sm:text-2xl text-center">STUDYTASK<span className="blink">_</span></h1>
      <p className="text-center opacity-80">PRESS START — masuk untuk lanjut quest</p>
      <div className="flex gap-2">{["login","register"].map(m=>
        <button type="button" key={m} className="btn flex-1" style={mode===m?{background:"var(--a1)",color:"var(--ink)",borderColor:"var(--a1)"}:{}}
          onClick={()=>{setMode(m);setErr("")}}>{m==="login"?"LOGIN":"DAFTAR"}</button>)}</div>
      <input placeholder="username" value={u} onChange={e=>setU(e.target.value)} autoComplete="username"/>
      <input type="password" placeholder="password (min 6)" value={p} onChange={e=>setP(e.target.value)}
        autoComplete={mode==="login"?"current-password":"new-password"}/>
      {err&&<div className="blink">! {err}</div>}
      <button className="btn pri py-3">{mode==="login"?"▶ MASUK":"▶ BUAT AKUN"}</button>
      {off&&<div className="opacity-60 text-center">demo mode: isi username/password bebas</div>}
    </form>
  </main>;
}

function Board({me,refresh,logout}){
  const empty={title:"",subject:"",deadline:"",priority:1,notes:""};
  const [tasks,setTasks]=useState([]),[f,setF]=useState(empty),[eid,setEid]=useState(null);
  const [q,setQ]=useState(""),[sure,setSure]=useState(null),[toast,setToast]=useState(""),[tab,setTab]=useState("todo");
  const load=async()=>{const r=await api("GET","/tasks");setTasks(Array.isArray(r.data)?r.data:[]);refresh()};
  useEffect(()=>{load()},[]);
  useEffect(()=>{if(me.new&&me.new.length){
    setToast("BADGE BARU: "+me.new.map(c=>BADGES.find(b=>b.c===c).n).join(", "));
    setTimeout(()=>setToast(""),4500)}},[me]);

  const save=async e=>{e.preventDefault();if(!f.title.trim())return;
    const {title,subject,deadline,priority,notes}=f,b={title,subject,deadline,priority,notes};
    eid?await api("PUT","/tasks/"+eid,b):await api("POST","/tasks",b);
    setF(empty);setEid(null);load()};
  const move=async(t,d)=>{const s=COLS[COLS.findIndex(c=>c.k===t.status)+d].k;
    await api("PUT","/tasks/"+t.id,s==="done"?{status:s,done_at:iso(0)}:{status:s});load()};
  const edit=t=>{setF({...empty,...t});setEid(t.id);window.scrollTo({top:0,behavior:"smooth"})};
  const del=async t=>{if(sure!==t.id){setSure(t.id);return}await api("DELETE","/tasks/"+t.id);setSure(null);load()};

  const doneN=tasks.filter(t=>t.status==="done").length;
  const xp=tasks.filter(t=>t.status==="done").reduce((a,t)=>a+t.priority*10,0);
  const late=tasks.filter(t=>t.status!=="done"&&day(t.deadline)<0).length;
  const shown=tasks.filter(t=>(t.title+t.subject).toLowerCase().includes(q.toLowerCase()));
  const days=me.days||[];

  return <main className="max-w-6xl 2xl:max-w-7xl mx-auto p-3 sm:p-4 md:p-8">
    <header className="flex flex-wrap items-start justify-between gap-3 mb-6">
      <div>
        <h1 className="h logo text-xl sm:text-3xl md:text-4xl">STUDYTASK<span className="blink">_</span></h1>
        <p className="opacity-80">Quest board mahasiswa — selesaikan tugas, naik level.</p>
      </div>
      <button className="btn max-w-full truncate" onClick={logout}>LOGOUT @{me.user.username}</button>
    </header>

    <section className="grid md:grid-cols-3 gap-4 sm:gap-6 mb-4 sm:mb-6">
      <div className="px p-4 md:col-span-2">
        <div className="h text-xs mb-3">PLAYER · LV {Math.floor(xp/50)+1}</div>
        <div className="flex gap-1 mb-1">
          {Array.from({length:10},(_,i)=><div key={i} className={"seg "+(i<(xp%50)/5?"on":"")}/>)}
        </div>
        <div className="mb-4">{xp%50}/50 XP · {doneN} quest selesai · {late} telat</div>
        <div className="flex items-center gap-3 mb-2">
          <Pix m={BADGES[4].m} z={25} col="var(--hot)"/>
          <span className="h text-xs">STREAK {me.streak} HARI</span>
          <span className="opacity-60">(terbaik: {me.best})</span>
        </div>
        <div className="flex gap-1">
          {Array.from({length:7},(_,i)=>{const d=iso(i-6);return <div key={d} title={d} className={"seg "+(days.includes(d)?"on hot":"")}/>})}
        </div>
        <div className="flex justify-between opacity-60 text-base"><span>6 hari lalu</span><span>hari ini</span></div>
      </div>
      <Pomo/>
    </section>

    <section className="px p-4 mb-6">
      <div className="h text-xs mb-4">ACHIEVEMENTS {me.earned.length}/{BADGES.length}</div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        {BADGES.map(b=><div key={b.c} className="text-center" style={me.earned.includes(b.c)?{}:{opacity:.35,filter:"grayscale(1)"}}>
          <Pix m={b.m} col={BCOL[b.c]}/>
          <div className="h text-[8px] mt-2">{b.n}</div>
          <div className="text-base leading-4 mt-1">{b.d}</div>
        </div>)}
      </div>
    </section>

    <form onSubmit={save} className="px p-4 grid md:grid-cols-6 gap-3 mb-6">
      <div className="h text-xs md:col-span-6">{eid?"> EDIT QUEST":"> QUEST BARU"}</div>
      <input className="md:col-span-3" placeholder="Judul tugas *" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/>
      <input className="md:col-span-3" placeholder="Mata kuliah" value={f.subject} onChange={e=>setF({...f,subject:e.target.value})}/>
      <input className="md:col-span-2" type="date" value={f.deadline||""} onChange={e=>setF({...f,deadline:e.target.value})}/>
      <select className="md:col-span-1" value={f.priority} onChange={e=>setF({...f,priority:+e.target.value})}>
        {[1,2,3].map(p=><option key={p} value={p}>{PRI[p]}</option>)}
      </select>
      <input className="md:col-span-3" placeholder="Catatan (opsional)" value={f.notes||""} onChange={e=>setF({...f,notes:e.target.value})}/>
      <div className="md:col-span-6 flex gap-3">
        <button className="btn pri flex-1 sm:flex-none">{eid?"UPDATE":"+ TAMBAH"}</button>
        {eid&&<button type="button" className="btn" onClick={()=>{setF(empty);setEid(null)}}>BATAL</button>}
      </div>
    </form>

    <input className="mb-6" placeholder="cari judul / mata kuliah..." value={q} onChange={e=>setQ(e.target.value)}/>

    <div className="flex gap-2 mb-4 lg:hidden">
      {COLS.map(c=><button key={c.k} className="btn flex-1 px-1" onClick={()=>setTab(c.k)}
        style={tab===c.k?{background:CCOL[c.k],color:"var(--ink)",borderColor:CCOL[c.k]}:{}}>
        {c.n} ({shown.filter(t=>t.status===c.k).length})</button>)}
    </div>
    <section className="grid lg:grid-cols-3 gap-6">
      {COLS.map((c,ci)=>{
        const list=shown.filter(t=>t.status===c.k).sort((a,b)=>(a.deadline||"9")>(b.deadline||"9")?1:-1);
        return <div key={c.k} className={(tab===c.k?"block":"hidden")+" lg:block min-w-0"}>
          <div className="px p-2 h text-xs mb-4 hidden lg:block" style={{borderColor:CCOL[c.k],color:CCOL[c.k]}}>{c.n} ({list.length})</div>
          {!list.length&&<div className="opacity-50 text-center">-- kosong --</div>}
          <div className="grid md:grid-cols-2 lg:grid-cols-1 gap-4 items-start">
            {list.map(t=>{
              const hot=t.status!=="done"&&day(t.deadline)!==null&&day(t.deadline)<=1;
              return <div key={t.id} className="card p-3 min-w-0" style={{borderTop:"10px solid "+CCOL[c.k]}}>
                <div className="flex justify-between gap-2">
                  <span className="tag truncate">{t.subject||"UMUM"}</span>
                  <span style={{color:PCOL[t.priority]}} title={PRI[t.priority]}>{"■".repeat(t.priority)+"□".repeat(3-t.priority)}</span>
                </div>
                <div className="h text-[11px] my-2 break-words">{t.title}</div>
                {t.notes&&<div className="leading-5 mb-1 break-words">{t.notes}</div>}
                <div className={hot?"blink font-bold late":""}>DEADLINE: {lbl(t.deadline)}</div>
                <div className="flex gap-1 mt-2 flex-wrap">
                  {ci>0&&<button className="btn" onClick={()=>move(t,-1)}>◀</button>}
                  {ci<2&&<button className="btn" onClick={()=>move(t,1)}>▶</button>}
                  <button className="btn" onClick={()=>edit(t)}>EDIT</button>
                  <button className="btn" onClick={()=>del(t)}>{sure===t.id?"YAKIN?":"DEL"}</button>
                </div>
              </div>})}
          </div>
        </div>;
      })}
    </section>
    <footer className="h text-[10px] text-center mt-10 opacity-60">© STUDYTASK · MADE FOR MAHASISWA</footer>
    {toast&&<div className="toast h text-[10px] p-3 fixed bottom-3 left-3 right-3 sm:left-auto z-10 sm:max-w-xs">★ {toast}</div>}
  </main>;
}

function App(){
  const [me,setMe]=useState(undefined),[off,setOff]=useState(false);
  const refresh=async()=>{const r=await api("GET","/me?today="+iso(0));setOff(!!window.__off);setMe(r.ok?r.data:false)};
  useEffect(()=>{refresh()},[]);
  const logout=async()=>{await api("POST","/logout");setMe(false)};
  if(me===undefined)return <div className="h p-8">LOADING<span className="blink">...</span></div>;
  return <>
    {off&&<div className="demo h text-[9px] text-center py-1 px-2">DEMO MODE — backend tidak terhubung, data hanya contoh</div>}
    {me?<Board me={me} refresh={refresh} logout={logout}/>:<Auth done={refresh} off={off}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
